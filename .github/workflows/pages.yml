name: Deploy to GitHub Pages

# The app runs entirely in the browser against the static data bundle, so it needs
# no server. This publishes it to GitHub Pages on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer deploy supersede an in-flight one, but never cancel a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Regenerate the bundle from the committed dataset rather than trusting the
      # committed copy, so the shipped data can never drift from backend/app/data.
      - name: Rebuild static data bundle
        run: python scripts/build_static_bundle.py

      - name: Fail if the committed bundle was stale
        run: |
          if ! git diff --quiet -- frontend/public/data; then
            echo "The committed static bundle does not match backend/app/data."
            echo "Run: python scripts/build_static_bundle.py, then commit the result."
            git diff --stat -- frontend/public/data
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Pages serves the site from /<repo>/, so assets and data need that prefix.
      - name: Build
        working-directory: frontend
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
